name: Build Ashes of Dereliction

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  export-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.1"
          include-templates: true

      - name: Vérifier la version
        run: godot --version

      - name: Créer le dossier Build
        run: mkdir -p Build

      - name: Exporter le jeu
        working-directory: ./rpg_v1.8
        run: |
          godot --headless --path . --export-release "Windows Desktop" ../Build/AshesOfDereliction.exe

      - name: Créer le ZIP
        run: |
          cd Build
          zip -r AshesOfDereliction.zip .

      - name: Supprimer l'ancienne Release "latest"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y

      - name: Supprimer l'ancien tag "latest"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin :refs/tags/latest || true

      - name: Créer la nouvelle Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version
          files: Build/AshesOfDereliction.zip