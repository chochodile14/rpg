<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ashes of Dereliction</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    margin-top:80px;
}

h1{
    font-size:48px;
}

.version{
    font-size:24px;
    margin:20px;
}

button{
    font-size:22px;
    padding:15px 35px;
    cursor:pointer;
    border:none;
    border-radius:10px;
}

button:hover{
    transform:scale(1.05);
}
</style>

</head>

<body>

<h1>Ashes of Dereliction</h1>

<div class="version">
Version actuelle :
<span id="version">Chargement...</span>
</div>

<button id="download">
Télécharger
</button>

<script>

const owner="chochodile14";
const repo="rpg";

fetch(`https://api.github.com/repos/${owner}/${repo}/releases/latest`)
.then(r=>r.json())
.then(release=>{

document.getElementById("version").innerText=release.tag_name;

document.getElementById("download").onclick=()=>{

window.location.href=release.assets[0].browser_download_url;

};

});

</script>

</body>
</html>
